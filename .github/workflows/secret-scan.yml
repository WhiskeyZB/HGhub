name: Secret scan

# 凭据扫描：push 到 main 或提 PR 时跑 gitleaks，扫当前文件树；
# 发现凭据就失败，拦下合并。历史已核查干净，不扫 git 历史。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 用官方镜像直接跑，--no-git 只扫当前文件树（不扫历史）；
      # 不用 gitleaks-action：它默认扫 git 历史，仓库历史已核查干净，没必要每次重扫。
      - name: 扫当前文件树
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --no-git --redact --exit-code 1
