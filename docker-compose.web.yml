# HGhub Web 服务版（NAS 部署）：仅局域网 / Tailscale 使用，不要把端口映射到公网。
# 出口：egress 服务 = sing-box 挂 Cloady 日本节点 (VLESS+WS+TLS)；配置在 ../egress/config.json（不入仓库）。
# 分流：HGHUB_NOPROXY 里的域名（如封面 CDN pic.drleao.cn，国内可直达）由服务端直连，不走出口。
services:
  egress:
    build:
      context: ../egress
    container_name: hghub-egress
    restart: unless-stopped
  hghub:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: hghub-web:local
    container_name: hghub-web
    restart: unless-stopped
    depends_on:
      - egress
    ports:
      # 左侧可按需改绑 NAS 的局域网地址；不要改成公网入口
      - "8892:8892"
    environment:
      TZ: Asia/Shanghai
      HGHUB_PORT: "8892"
      HGHUB_DATA: /data
      HGHUB_PROXY: "socks5h://egress:1080"
      HGHUB_NOPROXY: "pic.drleao.cn"
      HGHUB_STRICT: "0"
    volumes:
      - ../data:/data
    dns:
      - 223.5.5.5
      - 119.29.29.29
