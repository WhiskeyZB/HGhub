[package]
name = "hghub-server"
version = "1.2.0"
description = "HGhub Web 服务版（由 Tauri 客户端后端移植，见 server/src 各文件头注）"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
# 与 src-tauri/Cargo.toml 保持一致（system-proxy 必须显式列出，原因见 src-tauri/src/net.rs 顶部说明）
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
  # Web 服务版新增：让 HGHUB_PROXY 支持 socks5://（经 SSH 隧道边车出海，见 docker-compose.web.yml）
  "socks",
] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"

[profile.release]
opt-level = 2
